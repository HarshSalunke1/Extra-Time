<!doctype html>

<head>
<meta charset="utf-8">

<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#031210}
a{color:#8fb5ab;text-decoration:none;transition:color .2s}
a:hover{color:#E6FBF6}
a:focus-visible,button:focus-visible{outline:2px solid #E6FBF6;outline-offset:4px;border-radius:4px}

/* ---------- stage: a 4:3 scene scaled to the hero height ---------- */
.stage{position:absolute;top:0;left:50%;height:100%;aspect-ratio:4/3;transform:translateX(-50%);container-type:size;--k:1;--lo:.8;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,#000 18%,#000 82%,transparent 100%)}
.stage.is-playing{--k:.3;--lo:.45}
.layer{position:absolute;top:0;right:0;bottom:0;left:0;transition:transform .45s cubic-bezier(.2,.7,.2,1);will-change:transform}
.l-bg{background:url(./assets/8b00835189ebc232cd5b2108cb37481b.jpg) center / 100% 100% no-repeat}
.l-fg-art{position:absolute;top:0;right:0;bottom:0;left:0;background:url(./assets/f86147a5379e09a7a22c87a2b4a09ca0.png) center / 100% 100% no-repeat}

/* ---------- floodlight beams = live equalizer ---------- */
.beam{position:absolute;left:var(--x);width:6.25%;height:calc(var(--h) * 1cqh);top:calc((58.83 - var(--h)) * 1cqh);border-radius:50px 50px 0 0;border-radius:3.4cqh 3.4cqh 0 0;background:var(--g);transform-origin:50% 100%;animation:eq calc(var(--d0) * var(--k)) ease-in-out infinite alternate;animation-delay:var(--dl)}
.beam::before,.rbeam::before{content:"";position:absolute;left:8%;right:8%;top:3%;height:16%;border-radius:40%;opacity:var(--do,.8);background-image:radial-gradient(circle,rgba(230,251,246,.95) 1.2px,transparent 1.7px);background-size:9px 9px}
.refl{position:absolute;left:0;right:0;top:58.83%;height:41.17%;overflow:hidden;opacity:.45;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
.rbeam{position:absolute;left:var(--x);width:6.25%;top:0;height:calc(var(--h) * 1cqh);border-radius:0 0 50px 50px;border-radius:0 0 3.4cqh 3.4cqh;background:var(--gr);transform-origin:50% 0;animation:eq calc(var(--d0) * var(--k)) ease-in-out infinite alternate;animation-delay:var(--dl)}
.rbeam::before{top:auto;bottom:3%}
@keyframes eq{from{transform:scaleY(1);opacity:1}to{transform:scaleY(var(--lo));opacity:.8}}

.b1{--x:33.25%;--h:30.5;--d0:4.2s;--dl:-1.1s;--do:.3;--g:linear-gradient(180deg,rgba(143,207,191,.10),rgba(191,232,220,.34));--gr:linear-gradient(0deg,rgba(143,207,191,.10),rgba(191,232,220,.34))}
.b2{--x:40.625%;--h:41.75;--d0:3.1s;--dl:-0.4s;--do:.8;--g:linear-gradient(180deg,rgba(12,65,55,.30),rgba(6,214,160,.75) 60%,rgba(61,240,189,.98));--gr:linear-gradient(0deg,rgba(12,65,55,.30),rgba(6,214,160,.75) 60%,rgba(61,240,189,.98))}
.b3{--x:48.5%;--h:48.4;--d0:3.7s;--dl:-2.2s;--do:.9;--g:linear-gradient(180deg,rgba(155,232,210,.38),rgba(230,251,246,.85));--gr:linear-gradient(0deg,rgba(155,232,210,.38),rgba(230,251,246,.85))}
.b4{--x:56.375%;--h:37.6;--d0:2.8s;--dl:-1.6s;--do:.6;--g:linear-gradient(180deg,rgba(127,217,192,.16),rgba(182,242,224,.55));--gr:linear-gradient(0deg,rgba(127,217,192,.16),rgba(182,242,224,.55))}
.b5{--x:64.125%;--h:30.5;--d0:4.6s;--dl:-3s;--do:.3;--g:linear-gradient(180deg,rgba(143,207,191,.10),rgba(191,232,220,.34));--gr:linear-gradient(0deg,rgba(143,207,191,.10),rgba(191,232,220,.34))}

/* ---------- ambient glow, lamps, searchlights ---------- */
.halo{position:absolute;left:50%;top:48cqh;width:70cqh;height:70cqh;background:radial-gradient(circle,rgba(6,214,160,.30),transparent 62%);animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.5;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.lamp{position:absolute;width:10cqh;height:10cqh;background:radial-gradient(circle,rgba(158,245,218,.65),transparent 65%);animation:twinkle 2.4s ease-in-out infinite alternate}
.lamp.l1{left:26.9%;top:34.6%;transform:translate(-50%,-50%)}
.lamp.l2{left:79.1%;top:34.6%;transform:translate(-50%,-50%);animation-delay:-1.2s}
.lamp.l3{left:31.25%;top:54.2%;width:24cqh;height:7cqh;border-radius:50%;background:radial-gradient(ellipse,rgba(6,214,160,.55),transparent 70%);animation-duration:3.2s}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.sweep{position:absolute;width:0;height:0;transform-origin:0 0}
.sweep::before{content:"";position:absolute;left:-11cqh;top:0;width:22cqh;height:80cqh;background:linear-gradient(180deg,rgba(158,245,218,.32),rgba(158,245,218,0));clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);mix-blend-mode:screen}
.sweep.s1{left:26.9%;top:34.6%;animation:sweepL 11s ease-in-out infinite alternate}
.sweep.s2{left:79.1%;top:34.6%;animation:sweepR 13s ease-in-out infinite alternate}
@keyframes sweepL{from{transform:rotate(172deg)}to{transform:rotate(224deg)}}
@keyframes sweepR{from{transform:rotate(190deg)}to{transform:rotate(136deg)}}

/* ---------- mist, embers, water shimmer ---------- */
.mist{position:absolute;left:-10%;width:120%;background:radial-gradient(ellipse at center,rgba(191,234,223,.28) 0%,rgba(191,234,223,0) 65%);animation:drift 20s ease-in-out infinite alternate}
.mist.m1{top:54cqh;height:10cqh}
.mist.m2{top:57cqh;height:6cqh;animation-direction:alternate-reverse;animation-duration:26s;opacity:.8}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.p{position:absolute;left:var(--x);top:58cqh;width:var(--s);height:var(--s);border-radius:50%;background:#bff5e3;box-shadow:0 0 6px 1px rgba(6,214,160,.7);opacity:0;animation:rise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}100%{transform:translate(calc(var(--dx) * 1cqh),calc(var(--r) * -1cqh));opacity:0}}
.rip{position:absolute;height:1px;left:var(--x);width:var(--w);top:var(--y);background:linear-gradient(90deg,transparent,rgba(207,238,230,.35),transparent);animation:shimmer var(--t) ease-in-out infinite alternate}
@keyframes shimmer{from{transform:translateX(-5%);opacity:.12}to{transform:translateX(5%);opacity:.8}}

.live-dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.play{transition:transform .2s,box-shadow .2s}
.play:hover{transform:scale(1.06);box-shadow:0 0 26px rgba(6,214,160,.55)}
.ctrl-btn{transition:all .2s ease;opacity:.8}
.ctrl-btn:hover{opacity:1;transform:scale(1.12);color:#E6FBF6 !important;background:rgba(230,251,246,.18) !important}
.soundwave{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.soundwave span{width:2.5px;background:#06D6A0;border-radius:1px;height:3px;transition:height .3s}
.stage.is-playing .soundwave span{animation:soundbar .75s ease-in-out infinite alternate}
.stage.is-playing .soundwave span:nth-child(2){animation-delay:-0.35s;animation-duration:.55s}
.stage.is-playing .soundwave span:nth-child(3){animation-delay:-0.15s;animation-duration:.9s}
.stage.is-playing .soundwave span:nth-child(4){animation-delay:-0.45s;animation-duration:.65s}
@keyframes soundbar{0%{height:2px}100%{height:12px}}

@media (max-width:720px){.nav-links{display:none}}
@media (prefers-reduced-motion:reduce){
  .beam,.rbeam,.halo,.lamp,.mist,.live-dot{animation:none !important}
  .p,.sweep{display:none}
  .layer{transform:none !important;transition:none}
  .play,.ctrl-btn{transition:none}
}
</style>
</helmet>

<div style="background:#031210;color:#E6FBF6;font-family:Inter,system-ui,sans-serif;min-width:320px">
  <section onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="position:relative;height:100vh;min-height:900px;overflow:hidden;background:#031210">

    <!-- live background -->
    <div class="stage {{liveClass}}" role="img" aria-label="Floodlight beams pulsing like an equalizer above a stadium, goalposts and a football, reflected on misty water at night">
      <div class="layer l-bg" style="transform:{{tBg}}"></div>

      <div class="layer" style="transform:{{tMid}}" aria-hidden="true">
        <div class="halo"></div>
        <div class="sweep s1"></div>
        <div class="sweep s2"></div>
        <div class="beam b1"></div>
        <div class="beam b2"></div>
        <div class="beam b3"></div>
        <div class="beam b4"></div>
        <div class="beam b5"></div>
        <div class="refl">
          <div class="rbeam b1"></div>
          <div class="rbeam b2"></div>
          <div class="rbeam b3"></div>
          <div class="rbeam b4"></div>
          <div class="rbeam b5"></div>
        </div>
      </div>

      <div class="layer" style="transform:{{tFg}}" aria-hidden="true">
        <div class="l-fg-art"></div>
        <div class="lamp l1"></div>
        <div class="lamp l2"></div>
        <div class="lamp l3"></div>
      </div>

      <div class="layer" style="transform:{{tMid}}" aria-hidden="true">
        <div class="mist m1"></div>
        <div class="mist m2"></div>
        <div class="rip" style="--x:24%;--w:22%;--y:62cqh;--t:5s"></div>
        <div class="rip" style="--x:58%;--w:24%;--y:63.5cqh;--t:6.5s"></div>
        <div class="rip" style="--x:34%;--w:18%;--y:66cqh;--t:7s"></div>
        <div class="rip" style="--x:52%;--w:20%;--y:68cqh;--t:5.5s"></div>
        <div class="rip" style="--x:40%;--w:14%;--y:72cqh;--t:8s"></div>
        <div class="rip" style="--x:60%;--w:14%;--y:75cqh;--t:6s"></div>
        <span class="p" style="--x:35%;--s:3px;--t:7s;--dl:0s;--r:28;--dx:-3"></span>
        <span class="p" style="--x:38%;--s:2px;--t:9s;--dl:-2s;--r:40;--dx:4"></span>
        <span class="p" style="--x:42%;--s:3px;--t:8s;--dl:-5s;--r:34;--dx:-2"></span>
        <span class="p" style="--x:45%;--s:2px;--t:11s;--dl:-1s;--r:44;--dx:3"></span>
        <span class="p" style="--x:48%;--s:4px;--t:10s;--dl:-7s;--r:30;--dx:0"></span>
        <span class="p" style="--x:51%;--s:2px;--t:8s;--dl:-3s;--r:46;--dx:-4"></span>
        <span class="p" style="--x:54%;--s:3px;--t:12s;--dl:-9s;--r:38;--dx:3"></span>
        <span class="p" style="--x:57%;--s:2px;--t:9s;--dl:-4s;--r:32;--dx:5"></span>
        <span class="p" style="--x:60%;--s:3px;--t:10s;--dl:-6s;--r:42;--dx:-3"></span>
        <span class="p" style="--x:63%;--s:2px;--t:8s;--dl:-2s;--r:36;--dx:2"></span>
        <span class="p" style="--x:66%;--s:3px;--t:11s;--dl:-8s;--r:30;--dx:-2"></span>
        <span class="p" style="--x:69%;--s:2px;--t:9s;--dl:-10s;--r:40;--dx:4"></span>
        <span class="p" style="--x:40%;--s:2px;--t:13s;--dl:-11s;--r:48;--dx:-5"></span>
        <span class="p" style="--x:59%;--s:3px;--t:12s;--dl:-6s;--r:26;--dx:6"></span>
      </div>
    </div>

    <div style="position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(3,18,16,.7) 0%,rgba(3,18,16,0) 20%,rgba(3,18,16,0) 60%,rgba(3,18,16,.6) 100%);pointer-events:none"></div>

    <div style="position:relative;height:100%;box-sizing:border-box;padding:0 clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between">

      <header style="display:flex;align-items:center;justify-content:space-between;padding:32px 0">
        <a href="Main.dc.html" style="display:flex;align-items:center;gap:12px;color:#E6FBF6">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="14" cy="14" r="12"></circle><path d="M9 17v-4M14 20V8M19 17v-4"></path></svg>
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;letter-spacing:.01em;line-height:1">Extra Time</span>
        </a>
        <nav class="nav-links" style="display:flex;gap:40px;font-size:14px;letter-spacing:.04em">
          <a href="#shows">Shows</a>
          <a href="#schedule">Schedule</a>
          <a href="#about">About</a>
        </nav>
      </header>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <div style="display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#b4d6cc">
            <span class="live-dot" style="width:7px;height:7px;border-radius:50%;background:{{accent}}"></span>
            Live football &amp; music radio
          </div>
          <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(44px,6.4vw,84px);line-height:1;letter-spacing:-.01em;color:#E6FBF6">Hear the <em>game.</em></h1>
        </div>

        <!-- Music Player Pill (Always on Shuffle) -->
        <div style="width:min(580px,calc(100vw - 40px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:10px 22px 10px 12px;border-radius:999px;background:rgba(3,18,16,.75);border:1px solid rgba(230,251,246,.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:left">
          
          <!-- Controls: Prev, Play/Pause, Next -->
          <div style="display:flex;align-items:center;gap:8px;flex:none">
            <button class="ctrl-btn" onClick="{{prevTrack}}" aria-label="Previous Track" title="Previous Shuffled Track" style="width:36px;height:36px;border-radius:50%;border:0;padding:0;background:rgba(230,251,246,.08);color:#b4d6cc;display:flex;align-items:center;justify-content:center;cursor:pointer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button class="play" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width:52px;height:52px;border-radius:50%;border:0;padding:0;background:linear-gradient(180deg,{{accent}} 0%,#0aa57c 100%);color:#031210;display:flex;align-items:center;justify-content:center;cursor:pointer">
              <sc-if value="{{paused}}" hint-placeholder-val="{{ true }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"></path></svg>
              </sc-if>
              <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1"></rect><rect x="13.5" y="5" width="4.5" height="14" rx="1"></rect></svg>
              </sc-if>
            </button>

            <button class="ctrl-btn" onClick="{{nextTrack}}" aria-label="Next Track" title="Next Shuffled Track" style="width:36px;height:36px;border-radius:50%;border:0;padding:0;background:rgba(230,251,246,.08);color:#b4d6cc;display:flex;align-items:center;justify-content:center;cursor:pointer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>

          <!-- Track Info -->
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <div style="display:flex;align-items:center;gap:8px;line-height:1">
              <span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8fb5ab;font-weight:600">Now Playing</span>
              <span style="display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border-radius:999px;background:rgba(6,214,160,.16);color:{{accent}};border:1px solid rgba(6,214,160,.28)">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                SHUFFLE
              </span>
              <span style="font-size:10px;color:#789c92">{{trackNumber}}</span>
              <div class="soundwave" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
            <span style="font-size:15px;font-weight:500;color:#E6FBF6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="{{trackDisplay}}">{{trackDisplay}}</span>
          </div>

          <!-- Volume / Mute & Live Badge -->
          <div style="flex:none;display:flex;align-items:center;gap:10px">
            <button class="ctrl-btn" onClick="{{toggleMute}}" aria-label="Mute / Unmute" title="Mute / Unmute" style="width:30px;height:30px;border-radius:50%;border:0;padding:0;background:none;color:#8fb5ab;display:flex;align-items:center;justify-content:center;cursor:pointer">
              <sc-if value="{{isMuted}}" hint-placeholder-val="{{ false }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>
              </sc-if>
              <sc-if value="{{notMuted}}" hint-placeholder-val="{{ true }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              </sc-if>
            </button>
            <span style="font-size:12px;font-weight:600;letter-spacing:.14em;color:#b4d6cc">LIVE</span>
          </div>

        </div>
      </div>

      <footer style="display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center;padding:28px 0 32px;font-size:13px;color:#8fb5ab">
        <span>© 2026 Extra Time</span>
        <span style="display:flex;gap:28px">
          <a href="https://youtube.com/playlist?list=PLZHNkTV1FW4c" target="_blank" rel="noopener">ET Radio Playlist</a>
          <a href="#about">Contact</a>
          <a href="#about">Privacy</a>
        </span>
      </footer>
    </div>
  </section>
</div>

function shuffleList(len, avoidFirst = -1) {
  const arr = Array.from({ length: len }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  if (avoidFirst >= 0 && arr.length > 1 && arr[0] === avoidFirst) {
    const swap = Math.floor(Math.random() * (arr.length - 1)) + 1;
    [arr[0], arr[swap]] = [arr[swap], arr[0]];
  }
  return arr;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const shuffled = shuffleList(PLAYLIST.length);
    this.shuffledQueue = shuffled;
    this.queueIndex = 0;
    this.player = null;
    this.playerReady = false;
    this.wantsPlay = false;

    this.state = {
      playing: false,
      muted: false,
      currentTrack: PLAYLIST[shuffled[0]],
      queueIndex: 0,
      mx: 0,
      my: 0
    };
  }

  componentDidMount() {
    this.initYT();
  }

  componentWillUnmount() {
    if (this.player && this.player.destroy) {
      try { this.player.destroy(); } catch(e) {}
    }
  }

  initYT() {
    const setup = () => {
      if (this.player) return;
      const target = document.getElementById('yt-player');
      if (!target) return;

      this.player = new window.YT.Player('yt-player', {
        height: '200',
        width: '200',
        videoId: this.state.currentTrack.id,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          playsinline: 1,
          rel: 0,
          origin: window.location.origin
        },
        events: {
          onReady: (e) => {
            this.playerReady = true;
            if (this.wantsPlay) {
              e.target.playVideo();
            }
          },
          onStateChange: (e) => {
            if (e.data === 1) {
              this.setState({ playing: true });
            } else if (e.data === 2) {
              this.setState({ playing: false });
            } else if (e.data === 0) {
              this.nextTrack(true);
            }
          },
          onError: (e) => {
            console.warn('[ET Radio] Track error:', e.data, '- Skipping to next track');
            this.nextTrack(true);
          }
        }
      });
    };

    window.__etPlayerSetup = setup;

    if (window.YT && window.YT.Player) {
      setup();
    } else {
      const prevReady = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => {
        if (prevReady) prevReady();
        setup();
      };
      if (!document.getElementById('yt-iframe-script')) {
        const tag = document.createElement('script');
        tag.id = 'yt-iframe-script';
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
      }
    }
  }

  playTrackAtQueue(qIndex) {
    if (qIndex >= this.shuffledQueue.length) {
      const last = this.shuffledQueue[this.shuffledQueue.length - 1];
      this.shuffledQueue = shuffleList(PLAYLIST.length, last);
      qIndex = 0;
    } else if (qIndex < 0) {
      qIndex = this.shuffledQueue.length - 1;
    }
    this.queueIndex = qIndex;
    const track = PLAYLIST[this.shuffledQueue[qIndex]];
    this.setState({
      queueIndex: qIndex,
      currentTrack: track,
      playing: true
    });
    if (this.player && this.player.loadVideoById) {
      this.player.loadVideoById(track.id);
    } else {
      this.wantsPlay = true;
    }
  }

  nextTrack(auto = false) {
    this.playTrackAtQueue(this.queueIndex + 1);
  }

  prevTrack() {
    this.playTrackAtQueue(this.queueIndex - 1);
  }

  toggle() {
    if (!this.player || !this.playerReady) {
      this.wantsPlay = !this.state.playing;
      this.setState({ playing: !this.state.playing });
      return;
    }
    if (this.state.playing) {
      this.player.pauseVideo();
      this.setState({ playing: false });
    } else {
      const pState = this.player.getPlayerState ? this.player.getPlayerState() : -1;
      if (pState === -1 || pState === 5) {
        this.player.loadVideoById(this.state.currentTrack.id);
      } else {
        this.player.playVideo();
      }
      this.setState({ playing: true });
    }
  }

  toggleMute() {
    if (!this.player) return;
    if (this.state.muted) {
      this.player.unMute();
      this.setState({ muted: false });
    } else {
      this.player.mute();
      this.setState({ muted: true });
    }
  }

  renderVals() {
    const playing = !!this.state.playing;
    const muted = !!this.state.muted;
    const mx = this.state.mx || 0;
    const my = this.state.my || 0;
    const t = (fx, fy) => 'translate3d(' + (-mx * fx).toFixed(1) + 'px,' + (-my * fy).toFixed(1) + 'px,0)';
    const track = this.state.currentTrack || PLAYLIST[0];
    const trackNum = (this.state.queueIndex + 1) + ' / ' + PLAYLIST.length;

    return {
      accent: this.props?.accent ?? '#06D6A0',
      playing: playing,
      paused: !playing,
      isMuted: muted,
      notMuted: !muted,
      liveClass: playing ? 'is-playing' : '',
      playLabel: playing ? 'Pause Extra Time' : 'Play Extra Time',
      currentTitle: track.title,
      currentArtist: track.artist,
      trackDisplay: track.artist ? (track.artist + ' — ' + track.title) : track.title,
      trackNumber: trackNum,
      toggle: () => this.toggle(),
      nextTrack: () => this.nextTrack(),
      prevTrack: () => this.prevTrack(),
      toggleMute: () => this.toggleMute(),
      tBg: t(5, 3),
      tMid: t(11, 6),
      tFg: t(18, 10),
      onMove: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({
          mx: ((e.clientX - r.left) / r.width - 0.5) * 2,
          my: ((e.clientY - r.top) / r.height - 0.5) * 2
        });
      },
      onLeave: () => this.setState({ mx: 0, my: 0 })
    };
  }
}
</script>
</body>
