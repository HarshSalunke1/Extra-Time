<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Extra Time — Live Football & Music Radio</title>

  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <section class="hero-section">
    <!-- Live Animated Stadium Stage -->
    <div class="stage" role="img" aria-label="Floodlight beams pulsing like an equalizer above a stadium, goalposts and a football, reflected on misty water at night">
      <div class="layer l-bg"></div>

      <div class="layer layer-mid" aria-hidden="true">
        <div class="halo"></div>
        <div class="sweep s1"></div>
        <div class="sweep s2"></div>
        <div class="beam b1"></div>
        <div class="beam b2"></div>
        <div class="beam b3"></div>
        <div class="beam b4"></div>
        <div class="beam b5"></div>
        <div class="refl">
          <div class="rbeam b1"></div>
          <div class="rbeam b2"></div>
          <div class="rbeam b3"></div>
          <div class="rbeam b4"></div>
          <div class="rbeam b5"></div>
        </div>
      </div>

      <div class="layer layer-fg" aria-hidden="true">
        <div class="l-fg-art"></div>
        <div class="lamp l1"></div>
        <div class="lamp l2"></div>
        <div class="lamp l3"></div>
      </div>

      <div class="layer layer-mid" aria-hidden="true">
        <div class="mist m1"></div>
        <div class="mist m2"></div>
        <div class="rip" style="--x:24%;--w:22%;--y:62cqh;--t:5s"></div>
        <div class="rip" style="--x:58%;--w:24%;--y:63.5cqh;--t:6.5s"></div>
        <div class="rip" style="--x:34%;--w:18%;--y:66cqh;--t:7s"></div>
        <div class="rip" style="--x:52%;--w:20%;--y:68cqh;--t:5.5s"></div>
        <div class="rip" style="--x:40%;--w:14%;--y:72cqh;--t:8s"></div>
        <div class="rip" style="--x:60%;--w:14%;--y:75cqh;--t:6s"></div>
        <span class="p" style="--x:35%;--s:3px;--t:7s;--dl:0s;--r:28;--dx:-3"></span>
        <span class="p" style="--x:38%;--s:2px;--t:9s;--dl:-2s;--r:40;--dx:4"></span>
        <span class="p" style="--x:42%;--s:3px;--t:8s;--dl:-5s;--r:34;--dx:-2"></span>
        <span class="p" style="--x:45%;--s:2px;--t:11s;--dl:-1s;--r:44;--dx:3"></span>
        <span class="p" style="--x:48%;--s:4px;--t:10s;--dl:-7s;--r:30;--dx:0"></span>
        <span class="p" style="--x:51%;--s:2px;--t:8s;--dl:-3s;--r:46;--dx:-4"></span>
        <span class="p" style="--x:54%;--s:3px;--t:12s;--dl:-9s;--r:38;--dx:3"></span>
        <span class="p" style="--x:57%;--s:2px;--t:9s;--dl:-4s;--r:32;--dx:5"></span>
        <span class="p" style="--x:60%;--s:3px;--t:10s;--dl:-6s;--r:42;--dx:-3"></span>
        <span class="p" style="--x:63%;--s:2px;--t:8s;--dl:-2s;--r:36;--dx:2"></span>
        <span class="p" style="--x:66%;--s:3px;--t:11s;--dl:-8s;--r:30;--dx:-2"></span>
        <span class="p" style="--x:69%;--s:2px;--t:9s;--dl:-10s;--r:40;--dx:4"></span>
        <span class="p" style="--x:40%;--s:2px;--t:13s;--dl:-11s;--r:48;--dx:-5"></span>
        <span class="p" style="--x:59%;--s:3px;--t:12s;--dl:-6s;--r:26;--dx:6"></span>
      </div>
    </div>

    <!-- Vignette -->
    <div class="hero-vignette"></div>

    <div class="content-container">
      <!-- Top Navigation -->
      <header>
        <a href="index.html" class="brand">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="14" cy="14" r="12"></circle>
            <path d="M9 17v-4M14 20V8M19 17v-4"></path>
          </svg>
          <span class="brand-title">Extra Time</span>
        </a>
        <div class="nav-actions">
          <button id="drawerToggleBtn" class="nav-btn" aria-label="Open My Playlist">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span class="nav-btn-text">My Playlist</span>
          </button>
        </div>
      </header>

      <!-- Center Hero Area -->
      <div class="center-content">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <div class="subheading">
            <span class="live-dot"></span>
            Live football &amp; music radio
          </div>
          <h1 class="hero-headline">Hear the <em>game.</em></h1>
        </div>

        <!-- Main Player Card -->
        <div class="player-card">
          <!-- Controls -->
          <div class="player-controls">
            <button id="prevBtn" class="ctrl-btn" aria-label="Previous Track" title="Previous Shuffled Track">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
              </svg>
            </button>

            <button id="playBtn" class="play-btn" aria-label="Play Extra Time" title="Play Extra Time">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/>
              </svg>
            </button>

            <button id="nextBtn" class="ctrl-btn" aria-label="Next Track" title="Next Shuffled Track">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>
          </div>

          <!-- Track Info -->
          <div class="track-info">
            <div class="track-meta">
              <span class="track-meta-label">Now Playing</span>
              <div class="soundwave" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div id="trackTitle" class="track-title">Loading ET Radio…</div>
          </div>

          <!-- Actions -->
          <div class="player-actions">
            <button id="muteBtn" class="ctrl-btn mute-btn" aria-label="Mute / Unmute" title="Mute / Unmute">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer>
        <span>© 2026 Extra Time</span>
        <div style="display:flex;gap:24px">
          <a href="https://youtube.com/playlist?list=PLZHNkTV1FW4c" target="_blank" rel="noopener">ET Radio Playlist</a>
          <a href="#contact">Contact</a>
          <a href="#privacy">Privacy</a>
        </div>
      </footer>
    </div>
  </section>

  <!-- Off-Screen YouTube Player Engine (Size >= 200x200, moved off-screen, no display:none) -->
  <div id="yt-player-container" aria-hidden="true">
    <div id="yt-player"></div>
  </div>

  <!-- "My Playlist" Drawer (Requirement 5) -->
  <div id="drawerBackdrop" class="drawer-backdrop">
    <div class="playlist-drawer">
      <div class="drawer-header">
        <div>
          <div class="drawer-title">My Playlist</div>
          <div class="drawer-subtitle">Add YouTube tracks or local audio files</div>
        </div>
        <button id="drawerCloseBtn" class="drawer-close-btn" aria-label="Close My Playlist Drawer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="drawer-body">
        <!-- Add YouTube Link -->
        <div>
          <div class="drawer-section-title">Add YouTube Track</div>
          <div class="add-input-group">
            <input type="text" id="ytInput" class="drawer-input" placeholder="YouTube URL or Video ID...">
            <button id="addYtBtn" class="drawer-btn">Add</button>
          </div>
        </div>

        <!-- Add Local Audio File -->
        <div>
          <div class="drawer-section-title">Add Audio File</div>
          <input type="file" id="audioFileInput" accept="audio/*" style="display:none;">
          <button id="addFileBtn" class="drawer-btn" style="width:100%;padding:10px;background:rgba(230,251,246,0.08);color:var(--polar);border:1px solid var(--border-glass);">
            Choose Audio File (.mp3, .wav, .m4a)
          </button>
        </div>

        <!-- Saved Tracks List -->
        <div>
          <div class="drawer-section-title">
            <span>Saved in Browser</span>
            <span style="font-size:9px;color:var(--emerald);">localStorage</span>
          </div>
          <div id="customTrackList" class="custom-track-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
